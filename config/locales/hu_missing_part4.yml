      static_pages:
        democratic_quality_indicators:
          content: |-
            <h2>Mutatórendszer a demokratikus minőség méréséhez a Decidimben.</h2>

            <h3>Bevezetés</h3>
            <p>A demokratikus minőség a Decidim egyik alapelve. Ennek érvényesítése érdekében kidolgoztunk egy mutatórendszert, amely segít értékelni a platformon zajló részvételi folyamatok minőségét. Ez a cikk elmagyarázza, hogyan számítjuk ki ezeket a mutatókat.</p>

            <h3>Hogyan számítjuk ki a mutatókat?</h3>
            <p>A minőségi mutatók gyűjtésére két módszert határoztunk meg:</p>

            <ol>
              <li><strong>Automatikus mutatók:</strong> Ezeket közvetlenül a Decidim platform adataiból számítjuk.</li>
              <li><strong>Önértékelő kérdések:</strong> Ezek egy adminisztrátor által kitöltött űrlapon alapulnak.</li>
            </ol>

            <p>Minden mutatót százalékban fejezünk ki (n/összes). Ezt a százalékot ezután 1-től 5-ig terjedő pontszámmá alakítjuk:</p>

            <ul>
              <li>1 = 0–20%</li>
              <li>2 = 20–40%</li>
              <li>3 = 40–60%</li>
              <li>4 = 60–80%</li>
              <li>5 = 80–100%</li>
            </ul>

            <br><br>
            <h3>Automatikus mutatók</h3>
            <p>Ezeket a mutatókat a Decidimben elérhető adatokból számítjuk ki automatikusan. Részvételi folyamatonként értékeljük őket, és az adminisztrátorok nyilvánossá tehetik őket, így minden résztvevő hozzáférhet.</p>

            <p>Négy fő mutatót határoztunk meg: polgári befolyás, hibridizáció, reagálóképesség és nyomon követhetőség:</p>

            <h3>Polgári befolyás</h3>

            <p>Ez a mutató azt méri, hogy a polgárok milyen mértékben befolyásolták az elfogadott javaslatokat és a folyamat eredményeit.</p>

            <ul>
              <li>
                Polgári befolyás a javaslatokra
                <ul>
                  <li>Az elfogadott javaslatok aránya (n/összes)</li>
                  <li>Az elfogadott <em>polgári</em> javaslatok aránya az összes polgári javaslathoz képest (a jóváhagyott javaslatokra gyakorolt teljes polgári befolyás)</li>
                  <li>Az elfogadott polgári javaslatok aránya az összes elfogadott javaslathoz képest (a jóváhagyott javaslatokra gyakorolt relatív polgári befolyás)</li>
                </ul>
              </li>
              <li>
                Polgári befolyás a kimenetekre/eredményekre
                <ul>
                  <li>A polgári javaslatokhoz kapcsolódó eredmények aránya az összes eredményhez képest (a kimenetekre gyakorolt teljes polgári befolyás)</li>
                </ul>
              </li>
            </ul>

            <h3>Hibridizáció</h3>

            <p>Ez a mutató azt méri, hogy a folyamat során milyen mértékben ötvöződnek az online és az offline terek.</p>

            <ul>
              <li>Aktív a találkozó komponens? (Igen=5, Nem=0)</li>
              <li>Vannak személyes találkozók? (Igen=5, Nem=0)</li>
              <li>Vannak online találkozók? (Igen=5, Nem=0)</li>
              <li>Vannak hibrid találkozók? (Igen=5, Nem=0)</li>
              <li>Vannak találkozókból létrejött javaslatok? (Igen=5, Nem=0)</li>
            </ul>

            <h3>Reagálóképesség</h3>

            <p>Ez a mutató azt méri, mennyire reagál a szervezet a résztvevők hozzájárulásaira. Azt tükrözi, hogyan vesz részt a hivatalos válaszokon és a megvalósított döntéseken keresztül.</p>

            <ul>
              <li>A megválaszolt javaslatok aránya (n/összes) – a javaslatokra adott intézményi reagálóképesség</li>
              <li>A 100%-ban teljesült eredmények aránya (n/összes)</li>
            </ul>

            <h3>Nyomon követhetőség</h3>

            <p>Ez a mutató a részvételi folyamat átláthatóságát és nyomon követhetőségét méri. Azt tükrözi, mennyire könnyen követhetik a résztvevők a javaslatok alakulását, és mennyire ellenőrizhetik az intézményi lépéseket a közzétett nyilvántartásokon keresztül.</p>

            <ul>
              <li>Előzménnyel rendelkező javaslatok száma (n/összes)</li>
              <li>A javaslatokhoz kapcsolódó eredmények aránya (n/összes)</li>
              <li>A közzétett jegyzőkönyvvel lezárt találkozók aránya (n/összes)</li>
              <li>A nyílt adatok modul aktiválása (kétértékű: 0 vagy 5)</li>
              <li>A költségvetésekhez kapcsolódó javaslatok aránya (n/összes)</li>
            </ul>

            <br><br>
            <h3>Önértékelési mutatók</h3>

            <p>Az automatikus mutatók mellett javasoljuk egy <strong>önértékelő űrlap</strong> használatát az egyes részvételi folyamatok minőségi dimenzióinak értékelésére. Ezt az űrlapot a platform adminisztrátorai töltik ki az egyes folyamatok végén, a válaszok pedig nyilvánosan megjelennek a mutatók tartalomblokkjában.</p>

            <p>Ezek a kérdések a demokratikus minőségnek olyan szempontjait igyekeznek megragadni, amelyek csak mennyiségi adatokból nem értékelhetők. Fontos megjegyezni, hogy a kérdőív válaszait a platform adminisztrátorainak véleménye befolyásolja.</p>

            <br><br>
            <h3>Önértékelő kérdések</h3>

            <p>Az alábbiakban találhatók az adminisztrátorok által megválaszolt önértékelő űrlap kérdései, valamint az egyes válaszokhoz tartozó értékek.</p>

            <h4>Tájékoztatottság</h4>

            <ol>
              <li>A közzétett információ világosan bemutatja-e a döntéshozatali mechanizmusokat (pl. szavazás, konszenzus, közvetlen tárgyalások)?
                <ul>
                  <li>Nincs világosság = 0</li>
                  <li>Alacsony világosság = 1</li>
                  <li>Elegendő világosság = 2,5</li>
                  <li>Teljes világosság = 5</li>
                </ul>
              </li>
