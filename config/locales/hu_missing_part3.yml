        body_2: "Ha nem te végezted a módosítást, kérlek, jelentkezz be a fiókodba, és változtasd meg a jelszavadat. Ha nem tudsz bejelentkezni, kérlek, vedd fel a kapcsolatot a platform támogatásával."
