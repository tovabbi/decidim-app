      notify_deprecation_to_member:
        body_1: 'Fontos változásról szeretnénk tájékoztatni azzal a felhasználói csoporttal kapcsolatban, amelynek tagja vagy: <strong>%{group_name}</strong>.'
        body_2: 'A szervezetek élményének egyszerűsítése érdekében a „Felhasználói csoportok” funkció megszűnik. A felhasználói csoportod profilját most átalakítottuk egy hagyományos résztvevői profillá.'
        greeting: "Kedves %{name}!"
        instructions_1: "Ha hozzáférsz ahhoz az e-mail-fiókhoz, kérlek, nézd meg a postaládádat az útmutatásért."
        instructions_2: "Ha nem, egy hozzáféréssel rendelkező kollégádnak kell megadnia a jelszót, és megosztania veletek a belépési adatokat."
        instructions_intro: "A csoport tagjai mostantól közös belépési adatokkal (e-mail-cím és jelszó) férnek hozzá ehhez a profilhoz. Elküldtük a(z) %{email} címre az új jelszó beállításához szükséges útmutatást."
        instructions_title: "<strong>Mit jelent ez számodra</strong>"
        subject: "Fontos változás a csoportod profiljával kapcsolatban"
      notify_deprecation_to_owner:
        body_1: "Fontos változásról szeretnénk tájékoztatni a(z) %{organization_name} szervezetnél lévő csoportprofilodat illetően."
        body_2: 'A hozzátok hasonló szervezetek élményének egyszerűsítése és javítása érdekében a „Felhasználói csoportok” funkció megszűnik. A csoportodat (<strong>%{name}</strong>) hagyományos fiókká alakítottuk át.'
        body_3: "Ahhoz, hogy továbbra is hozzáférj a fiókodhoz és megoszthasd a hozzáférést, be kell állítanod egy jelszót. Ezután a belépési adatokat (e-mail-cím és jelszó) bárkivel megoszthatod."
        greeting: "Kedves %{name}!"
        instructions_1: "Kattints az alábbi hivatkozásra a jelszó beállításához:"
        instructions_2: "Oszd meg a belépési adatokat (e-mail-cím: %{email} és az új jelszó) a kollégáiddal."
        instructions_title: "<strong>Mit kell tenned</strong>"
        set_password: "Jelszó beállítása"
        subject: "Fontos változás a csoportod profiljával kapcsolatban"
      notify_user_group_patched:
        body_1_html: "Fontos változásról szeretnénk tájékoztatni a(z) %{organization_name} szervezetnél lévő csoportprofilodat illetően."
        body_2_html: 'A hozzátok hasonló szervezetek élményének egyszerűsítése és javítása érdekében a „Felhasználói csoportok” funkció megszűnik. A csoportodat (<strong>%{name}</strong>) hagyományos fiókká alakítottuk át.'
        body_3_html: "Ahhoz, hogy továbbra is hozzáférj a fiókodhoz és megoszthasd a hozzáférést, új e-mail-címet és jelszót kell beállítanod. Kérlek, vedd figyelembe, hogy a csoportod minden tagja megkapja ezt az e-mailt. A folyamatos hozzáférés érdekében belső egyeztetéssel meg kell állapodnotok a közös belépési adatokban (e-mail-cím és jelszó), amelyet mindenki használni fog."
        greeting: "Kedves %{name}!"
        instructions_1_html: 'Használd a következő ideiglenes belépési adatokat a bejelentkezéshez: <br><br> Felhasználónév: <strong>%{email}</strong> <br> Jelszó: <strong>%{password}</strong><br><br>'
        instructions_2_html: "Állíts be új e-mail-címet és jelszót."
        instructions_3_html: "Oszd meg a kiválasztott belépési adatokat a kollégáiddal, hogy az egész csoport továbbra is hozzáférhessen a fiókhoz."
        instructions_title_html: "<strong>Mit kell tenned</strong>"
        subject: "Fontos változás a csoportod profiljával kapcsolatban"
