    open_data:
      index:
        description: "Üdvözlünk a(z) %{organization_name} nyílt adatok oldalán! Itt olyan adatfájlokat találsz, amelyek rendszeresen készülnek a(z) %{organization_name} különböző tanácskozási és irányítási folyamataiból. Ezeket a fájlokat az átláthatóság, a hozzáférhetőség és az együttműködés elősegítése érdekében tesszük közzé. Lentebb részletes információt találsz arról, mik ezek a fájlok, hogyan nyithatod meg és dolgozhatsz velük, valamint az egyes fájlok tartalmának és szerkezetének leírását."
        detailed:
          body_1: "Alább az egyes adatkészletek leírását találod, a sémájukkal (szerkezetükkel) és a tartalmazott információ típusával együtt:"
          components: "Komponensek"
          spaces: "Részvételi terek"
          title: "Az egyes fájlok részletes magyarázata"
        download:
          components: "Komponensek"
          core: "Alap"
          spaces: "Részvételi terek"
          title: "Erőforrások letöltése"
        download_open_data: "Az összes nyílt adatfájl letöltése"
        download_resource: "%{resource_name} letöltése CSV formátumban"
        explanation:
          body_1: "Ezek a fájlok a(z) %{organization_name} részvételi folyamataiból, például javaslatokból, hozzászólásokból és találkozókból exportált adatkészletek. Nyers, strukturált adatokat tartalmaznak, amelyeket elemzésre, kutatásra vagy más eszközökkel való integrációra használhatsz. Az adatok 24 óránként automatikusan frissülnek, így mindig a legfrissebb információhoz férhetsz hozzá."
          body_2: "Ezek a fájlok CSV (vesszővel tagolt értékek) formátumúak. Ez egy széles körben használt fájlformátum, amelyet számos szoftver meg tud nyitni és fel tud dolgozni, például táblázatkezelők, szövegszerkesztők és adatelemző eszközök."
          title: "Mik ezek a fájlok?"
        how_to:
          step_1:
            body_html: "Kattints az alább található hivatkozásokra, hogy letöltsd a CSV-fájlokat a számítógépedre."
            title: "1. Töltsd le a fájlokat"
          step_2:
            body_html: |-
              <ul>
                <li><b>Táblázatkezelő alkalmazások</b>: A CSV-fájlokat megnyithatod olyan alkalmazásokkal, mint a Microsoft Excel, a Google Táblázatok vagy a LibreOffice Calc. Nyisd meg az alkalmazást, válaszd a Fájl menü „Megnyitás” pontját, majd a letöltött CSV-fájlt.</li>
                <li><b>Szövegszerkesztők</b>: A CSV-fájlok bármelyik szövegszerkesztőben megnyithatók, például a Jegyzettömbben vagy a Sublime Textben. Ilyenkor a nyers adatok látszanak: minden sor egy rekord, az értékeket pedig vessző választja el.</li>
                <li><b>Adatelemző eszközök</b>: Ha ismered az olyan adatelemző eszközöket, mint a Python (pandas), az R vagy az SQL-adatbázisok, a CSV-fájlokat közvetlenül importálhatod feldolgozásra és elemzésre.</li>
              </ul>
            title: "2. Nyisd meg a fájlokat"
          step_3:
            body_html: |-
              <ul>
                <li><b>Szűrés és rendezés</b>: A táblázatkezelő alkalmazásokban szűrheted és rendezheted az adatokat, hogy egy-egy részhalmazra összpontosíts.</li>
                <li><b>Elemzés</b>: Használd az adatokat különféle elemzésekhez, például a javaslatok számának megszámolásához, a hozzászólások trendjeinek vizsgálatához vagy a találkozókon való részvétel értékeléséhez.</li>
                <li><b>Vizualizáció</b>: Készíthetsz diagramokat, grafikonokat és más vizualizációkat, amelyek segítenek az adatok értelmezésében.</li>
              </ul>
            title: "3. Dolgozz az adatokkal"
          title: "Hogyan nyisd meg a fájlokat és dolgozz velük"
        license:
          body_1_html: "A(z) %{organization_name} adatbázisa a(z) %{link_database} alatt érhető el. Az adatbázis egyes tartalmaira vonatkozó jogokat a(z) %{link_contents} licencelja."
          license_contents_link: "https://opendatacommons.org/licenses/dbcl/1.0/"
          license_contents_name: "Adatbázis-tartalmi licenc"
          license_database_link: "https://opendatacommons.org/licenses/odbl/1.0/"
          license_database_name: "Nyílt adatbázis-licenc"
          title: "Licenc"
        title: "Nyílt adatok"
